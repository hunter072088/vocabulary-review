<!doctype html>
<html><head><meta charset="utf-8"><title>VocabBuddy selftest</title></head>
<body>
<pre id="result">RUNNING</pre>
<script>
// 自動化測試：在 iframe 載入 index.html，注入假語音引擎後逐項操作並驗證。
// 執行：chrome --headless=new --dump-dom --virtual-time-budget=300000 http://localhost:8090/tests/selftest.html
const STUB = `<script>
window.__errors=[]; window.__spoken=[]; window.__completed=0;
window.addEventListener('error',e=>window.__errors.push(String(e.message)+' @'+(e.filename||'')+':'+e.lineno));
window.addEventListener('unhandledrejection',e=>window.__errors.push('rejection '+e.reason));
(function(){
  function U(t){this.text=t;this.lang='';this.rate=1;this.pitch=1;this.voice=null;}
  window.SpeechSynthesisUtterance=U;
  var cur=null,timer=null;
  var synth={speaking:false,pending:false,
    getVoices:function(){return [{lang:'en-US',name:'Fake Google US'}];},
    speak:function(u){window.__spoken.push({text:u.text,rate:u.rate});synth.speaking=true;cur=u;
      if(window.__noEnd)return;
      timer=setTimeout(function(){synth.speaking=false;var x=cur;cur=null;window.__completed++;if(x&&x.onend)x.onend({});},120);},
    cancel:function(){if(cur){clearTimeout(timer);var x=cur;cur=null;synth.speaking=false;
      setTimeout(function(){if(x.onerror)x.onerror({error:'canceled'});},0);}},
    pause:function(){},resume:function(){}};
  Object.defineProperty(window,'speechSynthesis',{value:synth,configurable:true});
})();
<\/script>`;

const results = [];
const sleep = ms => new Promise(r => setTimeout(r, ms));
function check(name, cond, extra) { results.push((cond ? 'PASS ' : 'FAIL ') + name + (extra ? '  -> ' + extra : '')); }

async function boot() {
  localStorage.clear();
  let html = await (await fetch('/index.html', {cache: 'no-store'})).text();
  html = html.replace('<head>', '<head><base href="/">' + STUB);
  const fr = document.createElement('iframe');
  fr.style.cssText = 'width:1200px;height:900px';
  document.body.appendChild(fr);
  fr.srcdoc = html;
  await new Promise(r => fr.addEventListener('load', r, {once: true}));
  await sleep(500);
  return fr;
}

async function waitFor(fn, timeout, step) {
  const t0 = Date.now();
  while (Date.now() - t0 < timeout) { if (fn()) return true; await sleep(step || 50); }
  return false;
}

(async () => {
  try {
    const fr = await boot();
    const w = fr.contentWindow, d = fr.contentDocument;
    const $ = id => d.getElementById(id);
    w.alert = () => {}; w.confirm = () => true;
    const setSel = (id, v) => { const e = $(id); e.value = v; e.dispatchEvent(new w.Event('change', {bubbles: true})); };
    const click = id => $(id).click();

    check('頁面載入無 JS 錯誤', w.__errors.length === 0, w.__errors.join(' | '));

    // ---- 分頁切換 ----
    const tabs = [...d.querySelectorAll('.nav-tab')];
    check('找到 5 個分頁按鈕', tabs.length === 5, 'count=' + tabs.length);
    for (const t of tabs) {
      t.click(); await sleep(30);
      const name = t.getAttribute('data-tab');
      const panel = $('tab-' + name);
      const active = [...d.querySelectorAll('.tab-panel.active')].map(p => p.id);
      check('分頁切換 ' + name, panel && panel.classList.contains('active') && active.length === 1, 'active=' + active.join(','));
    }

    // ---- 閱讀 / 測驗內容是否有渲染 ----
    check('閱讀文章已渲染', d.querySelectorAll('#reading-content .vocab-highlight').length > 10, 'highlights=' + d.querySelectorAll('#reading-content .vocab-highlight').length);
    check('閱讀題目已渲染', d.querySelectorAll('#reading-questions-container .question-block').length === 3);
    check('測驗 Part A 已渲染', d.querySelectorAll('#quiz-part-a .question-block').length === 5);

    // ---- 跟讀訓練室 ----
    tabs.find(t => t.dataset.tab === 'listening').click(); await sleep(30);
    const modeIds = ['word', 'both', 'example'];
    const firstWord = $('shadow-word').textContent;
    check('跟讀室已載入單字', firstWord.length > 0, firstWord);

    // 每個播放模式都要能動
    for (const mode of modeIds) {
      w.__spoken.length = 0;
      setSel('shadow-play-target', mode);
      setSel('shadow-repeat-count', '3');
      setSel('shadow-interval', '1.0');
      click('shadow-start-btn');
      const ok = await waitFor(() => w.__spoken.length >= 3, 15000);
      await sleep(1500); // 確認不會多播
      const n = w.__spoken.length;
      const txt = (w.__spoken[0] || {}).text || '';
      const expectOk = mode === 'word' ? txt === firstWord : mode === 'example' ? txt.length > firstWord.length + 5 && !txt.startsWith(firstWord + '...') : txt.startsWith(firstWord);
      check('模式 ' + mode + ' 播放 3 次且不多播', ok && n === 3 && expectOk, 'spoken=' + n + ' first="' + txt.slice(0, 40) + '" status="' + $('shadow-status-text').textContent + '" errors=' + w.__errors.join('|'));
      click('shadow-stop-btn'); await sleep(200);
    }

    // 重複次數 5
    w.__spoken.length = 0;
    setSel('shadow-play-target', 'word'); setSel('shadow-repeat-count', '5'); setSel('shadow-interval', '1.0');
    click('shadow-start-btn');
    await waitFor(() => w.__spoken.length >= 5, 20000); await sleep(1500);
    check('重複 5 次剛好 5 次', w.__spoken.length === 5, 'spoken=' + w.__spoken.length);

    // 停止按鈕中途有效
    w.__spoken.length = 0;
    setSel('shadow-repeat-count', '999');
    click('shadow-start-btn');
    await waitFor(() => w.__spoken.length >= 3, 15000);
    click('shadow-stop-btn'); await sleep(300);
    const afterStop = w.__spoken.length;
    await sleep(3000);
    check('無限循環可按停止並真的停下', w.__spoken.length === afterStop && afterStop >= 3, 'afterStop=' + afterStop + ' later=' + w.__spoken.length);
    check('停止後狀態燈熄滅', !$('shadow-target-box').classList.contains('is-looping'));

    // 連按兩次開始不應重疊雙倍播放
    w.__spoken.length = 0; w.__completed = 0;
    setSel('shadow-repeat-count', '3');
    click('shadow-start-btn'); await sleep(50); click('shadow-start-btn');
    await waitFor(() => w.__completed >= 3, 15000); await sleep(2500);
    check('連按開始不會重疊／重複播放（完整播完恰好 3 次）', w.__completed === 3, 'completed=' + w.__completed + ' spoken=' + w.__spoken.length);

    // 練習範圍 / 清單循環（新功能；舊版沒有則 FAIL）
    const scope = $('shadow-scope');
    check('有「練習範圍」選項', !!scope);
    if (scope) {
      for (const v of ['all', 'weak', 'checked']) {
        check('練習範圍含 ' + v, [...scope.options].some(o => o.value === v));
      }
      // 清單循環：全部單字，每字 2 次，只跑前 3 字後停止
      w.__spoken.length = 0;
      setSel('shadow-scope', 'all'); setSel('shadow-play-target', 'word');
      setSel('shadow-repeat-count', '2'); setSel('shadow-interval', '1.0');
      const li = $('shadow-list-loop'); if (li) { li.value = '1'; li.dispatchEvent(new w.Event('change', {bubbles: true})); }
      click('shadow-start-btn');
      await waitFor(() => w.__spoken.length >= 6, 30000);
      click('shadow-stop-btn'); await sleep(300);
      const words = [...new Set(w.__spoken.map(s => s.text))];
      check('清單模式會依序換下一個單字', words.length >= 3 && w.__spoken[0].text === w.__spoken[1].text, 'distinct=' + words.slice(0, 4).join(','));
      check('清單模式更新顯示的目前單字', $('shadow-word').textContent.length > 0);

      // 勾選清單
      setSel('shadow-scope', 'checked');
      w.__spoken.length = 0;
      click('shadow-start-btn'); await sleep(400);
      check('勾選範圍但未勾選時不會亂播並有提示', w.__spoken.length === 0 && /勾選/.test($('shadow-status-text').textContent), $('shadow-status-text').textContent);
      click('shadow-stop-btn');
    }

    // ---- 總表：匯入 / 勾選 / 刪除 ----
    tabs.find(t => t.dataset.tab === 'table').click(); await sleep(50);
    const rows0 = d.querySelectorAll('#vocab-table-body tr').length;
    check('總表列數 = 預設單字數', rows0 === 59, 'rows=' + rows0);
    $('import-textarea').value = 'resilience 韌性\nscalability\t可擴展性\nthroughput, 吞吐量';
    click('btn-submit-import');
    w.alert = () => {}; // 已被呼叫過，後續不再阻塞
    await sleep(200);
    const rows1 = d.querySelectorAll('#vocab-table-body tr').length;
    check('批次匯入 3 筆後總表 = 62', rows1 === 62, 'rows=' + rows1);
    const hasChk = d.querySelectorAll('#vocab-table-body input.row-check').length;
    check('總表有勾選框', hasChk === rows1, 'checks=' + hasChk);
    w.confirm = () => true;
    const delBtn = d.querySelector('#vocab-table-body .btn-del-sm');
    delBtn.click(); await sleep(100);
    check('刪除一筆後總表 = 61', d.querySelectorAll('#vocab-table-body tr').length === 61);
    check('重新整理資料後仍保留（localStorage）', JSON.parse(w.localStorage.getItem('vocab_app_custom_data_v2')).length === 61);

    // 勾選後用於跟讀
    const checks = [...d.querySelectorAll('#vocab-table-body input.row-check')];
    if (checks.length >= 2) {
      checks[0].click(); checks[1].click(); await sleep(50);
      tabs.find(t => t.dataset.tab === 'listening').click(); await sleep(50);
      setSel('shadow-scope', 'checked'); setSel('shadow-repeat-count', '1');
      const li = $('shadow-list-loop'); if (li) { li.value = '1'; li.dispatchEvent(new w.Event('change', {bubbles: true})); }
      w.__spoken.length = 0;
      click('shadow-start-btn');
      await waitFor(() => w.__spoken.length >= 2, 15000);
      click('shadow-stop-btn'); await sleep(200);
      const uniq = [...new Set(w.__spoken.map(s => s.text))];
      check('勾選 2 個單字可單獨跟讀', uniq.length === 2, uniq.join(','));
    }

    // ---- 進階循環情境 ----
    tabs.find(t => t.dataset.tab === 'listening').click(); await sleep(50);
    const st = w.eval('appState');
    const list = w.eval('activeVocabList');
    const idsAB = list.slice(0, 2).map(v => v.id);
    const common = () => { setSel('shadow-play-target', 'word'); setSel('shadow-interval', '1.0'); setSel('shadow-order', 'seq'); };

    // 清單無限循環：A B A B A
    st.checkedIds = new Set(idsAB);
    common(); setSel('shadow-scope', 'checked'); setSel('shadow-list-loop', '1'); setSel('shadow-repeat-count', '1');
    w.__spoken.length = 0; click('shadow-start-btn');
    await waitFor(() => w.__spoken.length >= 5, 40000); click('shadow-stop-btn'); await sleep(300);
    let seq = w.__spoken.slice(0, 5).map(s => s.text);
    check('清單循環：播完最後一個會繞回第一個', seq[0] === seq[2] && seq[1] === seq[3] && seq[0] !== seq[1] && seq[4] === seq[0], seq.join(','));

    // 不循環：A B 後停止
    setSel('shadow-list-loop', '0');
    w.__spoken.length = 0; click('shadow-start-btn');
    await waitFor(() => w.__spoken.length >= 2, 30000); await sleep(3000);
    check('不循環：整份練完一輪就停止', w.__spoken.length === 2 && /一輪/.test($('shadow-status-text').textContent) && !$('shadow-target-box').classList.contains('is-looping'), 'spoken=' + w.__spoken.length + ' ' + $('shadow-status-text').textContent);
    click('shadow-stop-btn');

    // 每字重複 2 次 + 清單：A A B B
    setSel('shadow-repeat-count', '2');
    w.__spoken.length = 0; click('shadow-start-btn');
    await waitFor(() => w.__spoken.length >= 4, 40000); await sleep(2500);
    seq = w.__spoken.map(s => s.text);
    check('每字重複 2 次再換下一個（A A B B）', seq.length === 4 && seq[0] === seq[1] && seq[2] === seq[3] && seq[0] !== seq[2], seq.join(','));

    // 待加強範圍
    st.checkedIds = new Set();
    w.toggleWeak(idsAB[0], true); w.toggleWeak(idsAB[1], true);
    setSel('shadow-repeat-count', '1'); setSel('shadow-scope', 'weak');
    w.__spoken.length = 0; click('shadow-start-btn');
    await waitFor(() => w.__spoken.length >= 2, 30000); await sleep(2500);
    check('待加強範圍只播放弱點單字', w.__spoken.length === 2, 'spoken=' + w.__spoken.length);
    w.toggleWeak(idsAB[0]); w.toggleWeak(idsAB[1]); // 還原

    // 隨機順序
    setSel('shadow-scope', 'all'); setSel('shadow-order', 'random'); setSel('shadow-list-loop', '0');
    w.__spoken.length = 0; click('shadow-start-btn');
    await waitFor(() => w.__spoken.length >= 4, 30000); click('shadow-stop-btn'); await sleep(300);
    check('隨機順序可正常播放', w.__spoken.length >= 4 && new Set(w.__spoken.map(s => s.text)).size >= 3, w.__spoken.map(s => s.text).join(','));
    setSel('shadow-order', 'seq');

    // 瀏覽器不觸發 onend（Chrome 語音 bug）也要能自己往下走
    w.__noEnd = true;
    setSel('shadow-scope', 'current'); setSel('shadow-repeat-count', '2');
    w.__spoken.length = 0; click('shadow-start-btn');
    const wd = await waitFor(() => w.__spoken.length >= 2, 60000);
    click('shadow-stop-btn'); w.__noEnd = false; await sleep(300);
    check('即使沒有 onend 事件，保險計時器仍會繼續下一次', wd, 'spoken=' + w.__spoken.length);

    // 總表批次刪除
    tabs.find(t => t.dataset.tab === 'table').click(); await sleep(50);
    const before = d.querySelectorAll('#vocab-table-body tr').length;
    w.toggleMastered(idsAB[0]); w.toggleMastered(idsAB[1]); await sleep(50);
    click('btn-delete-mastered'); await sleep(100);
    check('一鍵刪除已熟記單字', d.querySelectorAll('#vocab-table-body tr').length === before - 2, before + ' -> ' + d.querySelectorAll('#vocab-table-body tr').length);
    const rc = [...d.querySelectorAll('#vocab-table-body input.row-check')];
    rc[0].click(); rc[1].click(); rc[2].click(); await sleep(50);
    check('勾選數量顯示正確', $('table-checked-count').textContent === '3', $('table-checked-count').textContent);
    const b2 = d.querySelectorAll('#vocab-table-body tr').length;
    click('btn-delete-checked'); await sleep(100);
    check('刪除勾選的單字', d.querySelectorAll('#vocab-table-body tr').length === b2 - 3 && $('table-checked-count').textContent === '0');
    const dd = [...$('shadow-word-select').options].length;
    check('跟讀下拉選單同步更新', dd === d.querySelectorAll('#vocab-table-body tr').length, 'options=' + dd);

    // ---- 測驗流程 ----
    tabs.find(t => t.dataset.tab === 'quiz').click(); await sleep(50);
    click('btn-quiz-random'); await sleep(100);
    check('隨機測驗可產生', d.querySelectorAll('#quiz-part-a .question-block').length === 5);
    click('btn-submit-quiz'); await sleep(100);
    check('交卷後顯示分數', !$('quiz-score-summary').classList.contains('hidden'));

    check('全程無 JS 錯誤', w.__errors.length === 0, w.__errors.join(' | '));
  } catch (e) {
    results.push('FAIL 測試腳本例外 -> ' + e + (e && e.stack ? ' ' + e.stack.split('\n')[1] : ''));
  }
  const failed = results.filter(r => r.startsWith('FAIL')).length;
  document.getElementById('result').textContent = 'DONE\n' + results.join('\n') + '\nSUMMARY failed=' + failed + ' total=' + results.length;
})();
</script>
</body></html>
